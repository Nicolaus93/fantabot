[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fantabot"
version = "0.2.10"
description = "Budget-conscious Italian fantacalcio chat bot on Telegram and Modal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.6,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=1.68,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
legacy-news = [
    "feedparser>=6,<7",
    "playwright==1.42.0",
    "html2text>=2024.2.26",
]

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "ty>=0.0.86",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fantabot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.src]
# Legacy standalone scripts have independent Modal images/dependencies.
include = ["src/fantabot", "tests"]
